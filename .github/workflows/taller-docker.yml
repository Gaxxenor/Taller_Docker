name: Verificar y publicar taller Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'friendlyhello/**'
      - 'hello-world/**'
      - 'proyecto-java/**'
      - 'ci/**'
      - '.github/workflows/taller-docker.yml'
permissions:
  contents: read
  packages: write
jobs:
  taller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir y verificar las aplicaciones
        run: python3 ci/verificar.py
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar las imágenes verificadas
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for pair in 'friendlyhello:taller-verificado friendlyhello' 'taller-docker-java:0.1.0 taller-docker-java'; do
            read -r local_image remote_name <<< "$pair"
            remote_image="ghcr.io/$owner/$remote_name"
            docker tag "$local_image" "$remote_image:0.1.0"
            docker tag "$local_image" "$remote_image:latest"
            docker push "$remote_image:0.1.0" | tee "artifacts/push-$remote_name-version.txt"
            docker push "$remote_image:latest" | tee "artifacts/push-$remote_name-latest.txt"
            docker pull "$remote_image:0.1.0" | tee "artifacts/pull-$remote_name.txt"
            docker manifest inspect "$remote_image:0.1.0" > "artifacts/manifest-$remote_name.json"
          done
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidencias-docker-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
